<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b12" />
      <stop offset="50%" stop-color="#07131d" />
      <stop offset="100%" stop-color="#04080e" />
    </linearGradient>

    <!-- Red Neon Gradient for Text -->
    <linearGradient id="red-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="40%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00d4ff" />
      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="30%" stop-color="#00b8e6" />
      <stop offset="50%" stop-color="#38e1ff" />
      <stop offset="70%" stop-color="#00b8e6" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-blur">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00b8e6" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      fill: #e2e8f0;
    }
    .badge-text {
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38e1ff;
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.4; r: 4px; }
      50% { opacity: 1; r: 6px; }
      100% { opacity: 0.4; r: 4px; }
    }
  </style>

  <!-- Background Rect -->
  <rect width="900" height="220" rx="14" fill="url(#bg-grad)" />

  <!-- Ambient Red Glows -->
  <circle cx="150" cy="70" r="90" fill="#0891b2" opacity="0.18" filter="url(#ambient-blur)" />
  <circle cx="750" cy="120" r="110" fill="#22d3ee" opacity="0.14" filter="url(#ambient-blur)" />

  <!-- Subtle Tech Grid -->
  <rect width="900" height="220" rx="14" fill="url(#tech-grid)" />

  <!-- Border Outline -->
  <rect x="1.5" y="1.5" width="897" height="217" rx="13" fill="none" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.65" />

  <!-- Cybernetic Corner Accents -->
  <!-- Top-Left -->
  <path d="M 12 30 L 12 14 L 30 14" stroke="#00d4ff" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Top-Right -->
  <path d="M 888 30 L 888 14 L 870 14" stroke="#00d4ff" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Bottom-Left -->
  <path d="M 12 190 L 12 206 L 30 206" stroke="#00d4ff" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Bottom-Right -->
  <path d="M 888 190 L 888 206 L 870 206" stroke="#00d4ff" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Status Pill Badge at Top Center -->
  <g transform="translate(325, 24)">
    <rect width="250" height="26" rx="13" fill="#0a1b26" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="18" cy="13" r="5" fill="#00b8e6" class="pulse-dot" />
    <text x="135" y="17.5" text-anchor="middle" class="badge-text">OPEN TO INTERNSHIPS</text>
  </g>

  <!-- Main Name Header -->
  <text x="450" y="105" text-anchor="middle" class="title-text" fill="url(#red-glow-grad)" filter="url(#glow-red)">
    MD ZAHID HOSSAIN
  </text>
  <text x="450" y="105" text-anchor="middle" class="title-text" fill="#ffffff" fill-opacity="0.95">
    MD ZAHID HOSSAIN
  </text>

  <!-- Subtitle Tagline -->
  <text x="450" y="142" text-anchor="middle" class="subtitle-text">
    <tspan fill="#38e1ff">CSE STUDENT</tspan>
    <tspan fill="#64748b"> &#8226; </tspan>
    <tspan fill="#f1f5f9">FULL-STACK</tspan>
    <tspan fill="#64748b"> &#8226; </tspan>
    <tspan fill="#38e1ff">ML &amp; CV DEVELOPER</tspan>
  </text>

  <!-- Decorative Sleek Red Line with Diamond -->
  <g transform="translate(0, 160)">
    <line x1="200" y1="0" x2="420" y2="0" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.8" />
    <polygon points="450,-5 455,0 450,5 445,0" fill="#00b8e6" filter="url(#glow-red)" />
    <line x1="480" y1="0" x2="700" y2="0" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.8" />
  </g>

  <!-- Secondary Meta Tags at Bottom -->
  <g transform="translate(450, 192)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
      <tspan fill="#00b8e6">&lt;/&gt;</tspan> SHIPPING FULL-STACK &amp; ML PRODUCTS FROM DHAKA
    </text>
  </g>
</svg>
